version: 2

models:
  - name: metricflow_time_spine
    description: Calendar date spine required by MetricFlow for time-based metric aggregation.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: One row per calendar day.
        granularity: day
        tests:
          - not_null
          - unique
